name: Build

on:
    pull_request:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"

            # No lockfile, like a fresh `npx untitledui init`: the build must pass with
            # the latest versions package.json allows.
            - name: Install dependencies
              run: npm install --no-package-lock

            - name: Build
              run: npm run build
